[project]
name = "gazette"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["feedparser>=6.0", "psycopg[binary]>=3.2"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["network: test qui appelle Internet (exclu de la CI)"]

[tool.ruff]
line-length = 100
target-version = "py310"
