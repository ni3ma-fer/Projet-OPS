services:
  postgres:
    image: postgres:16-alpine
    container_name: gazette-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gazette}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?définir POSTGRES_PASSWORD dans .env}
      POSTGRES_DB: ${POSTGRES_DB:-gazette}
      AIRFLOW_DB_PASSWORD: ${AIRFLOW_DB_PASSWORD:?définir AIRFLOW_DB_PASSWORD dans .env}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init-airflow.sh:/docker-entrypoint-initdb.d/init-airflow.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  airflow:
    image: apache/airflow:3.4.0-python3.12
    container_name: gazette-airflow
    command: standalone
    user: "${AIRFLOW_UID:-50000}:0"
    ports:
      - "8080:8080"
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD}@postgres:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "True"   # dev uniquement : pas de login
    volumes:
      - ./dags:/opt/airflow/dags
      - ./sources.csv:/opt/airflow/sources.csv:ro
      - ./data:/opt/airflow/data
    depends_on:
      postgres:
        condition: service_healthy

  pipeline:
    build: .
    image: gazette:dev
    container_name: gazette-pipeline
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-gazette}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-gazette}
      RAW_DATA_DIR: /app/data/raw
      OUTPUT_DIR: /app/data/editions
    volumes:
      - ./sources.csv:/app/sources.csv:ro
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy

  # ---- Supervision (TD 8) : démarre seulement avec --profile monitoring ----
  prometheus:
    image: prom/prometheus:v3.13.5
    container_name: gazette-prometheus
    profiles: ["monitoring"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    ports:
      - "9090:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

  grafana:
    image: grafana/grafana:13.2.4
    container_name: gazette-grafana
    profiles: ["monitoring"]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?définir GRAFANA_ADMIN_PASSWORD dans .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3000:3000"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  postgres_data:
  prometheus_data:
  grafana_data: